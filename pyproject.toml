[project]
name = "simulator-worker"
version = "0.0.1"
authors = [{ name = "Michiel Tukker", email = "michiel.tukker@deltares.nl" }]
description = "Nieuwe Warmte Nu / OMOTES: simulator-worker."
readme = "README.md"
license = { file = "LICENSE" }
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Information Technology",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
]

requires-python = "==3.11.*"
dependencies = [
    "python-dotenv ~= 1.0.0",
    "omotes-sdk-python ~= 5.0.2",
    "omotes-simulator-core==0.0.30",
    "pyesdl==26.2",
    "pandas ~= 2.2.2",
    "kpi-calculator==0.4.3rc0",
]

[dependency-groups]
dev = [
    "setuptools ~= 75.6.0",
    "wheel ~= 0.45.1",
    "parameterized ~= 0.9.0",
    "pip-tools ~= 7.4.0",
    "ruff ~= 0.15.22",
    "ty ~= 0.0.61",
    "pytest ~= 8.3.4",
    "pytest-cov ~= 6.0.0",
    "build ~= 1.2.2",
]

[project.urls]
homepage = "https://www.nwn.nu"
documentation = "https://readthedocs.org"
repository = "https://github.com/Nieuwe-Warmte-Nu/simulator-worker"
changelog = "https://github.com/Nieuwe-Warmte-Nu/simulator-worker/blob/main/CHANGELOG.md"

# [project.scripts]
# simulator_worker = "simulator_worker:start_app"

[build-system]
requires = ["uv_build>=0.11.29,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "simulator_worker"

[tool.setuptools-git-versioning]
enabled = true
starting_version = "0.0.1"

[tool.pytest.ini_options]
addopts = "--cov=simulator_worker --cov-report=html --cov-report=term-missing --cov-fail-under=20"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.coverage.run]
source = ["src"]

[tool.ruff]
line-length = 120
preview = true

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "W",
    "F",   # Pyflakes
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "I",   # isort
    "D",   # pydocstyle
    "ANN", # flake8-annotations
    "DOC", # flake8-docstrings
    "S",   # flake8-bandit
]
ignore = [
    "D100", # Missing docstring in public module
    "D104", # Missing docstring in public package
]
exclude = ["justfile", ".editorconfig"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"src/simulator_worker/env.py" = [
    "DOC201", # Simple getter methods in EnvSettings use concise one-line docstrings.
]
"tests/**" = [
    "D101",   # Test classes do not require class docstrings.
    "D102",   # Test methods do not require method docstrings.
    "D103",   # Test helper functions do not require function docstrings.
    "DOC201", # Test docstrings do not require explicit Returns sections.
    "DOC501", # Test docstrings do not require explicit Raises sections.
    "S101",   # assert statements are standard in tests.
]
